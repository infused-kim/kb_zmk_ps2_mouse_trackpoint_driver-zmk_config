# keymap-drawer config, used by `just draw`.
#
# Only settings that differ from keymap-drawer's defaults belong here. See
# `keymap dump-config` for the defaults and
# https://github.com/caksoylar/keymap-drawer/blob/main/CONFIGURATION.md
# for all options.

draw_config:
  # Follow the viewer's light/dark mode (e.g. GitHub's theme in the README)
  dark_mode: auto

parse_config:
  # Leave transparent keys blank instead of showing ▽
  trans_legend: {t: '', type: trans}

  # Draw modifier functions like LG(Q) as ⌘Q instead of Gui+Q
  modifier_fn_map:
    left_ctrl: ⌃
    right_ctrl: ⌃
    left_shift: ⇧
    right_shift: ⇧
    left_alt: ⎇
    right_alt: ⎇
    left_gui: ⌘
    right_gui: ⌘
    keycode_combiner: '{mods}{key}'
    mod_combiner: '{mod_1}{mod_2}'

  # Exact bindings
  raw_binding_map:
    # TrackPoint settings (config/include/mouse_tp.dtsi)
    '&mms MS_TP_SENSITIVITY_DECR': "Sens\n-"
    '&mms MS_TP_SENSITIVITY_INCR': "Sens\n+"
    '&mms MS_TP_NEG_INERTIA_DECR': "Inert\n-"
    '&mms MS_TP_NEG_INERTIA_INCR': "Inert\n+"
    '&mms MS_TP_PTS_THRESHOLD_DECR': "PTS\n-"
    '&mms MS_TP_PTS_THRESHOLD_INCR': "PTS\n+"
    '&mms MS_TP_VALUE6_DECR': "Val6\n-"
    '&mms MS_TP_VALUE6_INCR': "Val6\n+"
    '&mms MS_RESET': "Conf\nReset"
    '&mms MS_LOG': "Conf\nLog"

    # Mouse keys
    '&mkp LCLK': {t: LMB, h: click}
    '&mkp RCLK': {t: RMB, h: click}
    '&mkp MCLK': {t: MMB, h: click}
    '&mmv MOVE_UP': {t: '↑', h: move}
    '&mmv MOVE_DOWN': {t: '↓', h: move}
    '&mmv MOVE_LEFT': {t: '←', h: move}
    '&mmv MOVE_RIGHT': {t: '→', h: move}
    '&msc SCRL_UP': {t: '↑', h: scroll}
    '&msc SCRL_DOWN': {t: '↓', h: scroll}

  # Keycode legends. Setting this replaces keymap-drawer's default map instead
  # of extending it, so the defaults are repeated at the end.
  zmk_keycode_map:
    # Editing and navigation
    SPACE: ⎵
    BSPC: ⌫
    DEL: ⌦
    TAB: ↹
    RETURN: ⏎
    RET: ⏎
    ESCAPE: ⎋
    ESC: ⎋
    LEFT: ←
    RIGHT: →
    UP: ↑
    DOWN: ↓
    LA(LEFT): ↞
    LA(RIGHT): ↠
    LG(LEFT): ⇤
    LG(RIGHT): ⇥

    # Symbols with their shifted variant
    BACKSLASH: {t: '\', s: '|'}
    COMMA: {t: ',', s: '<'}
    DOT: {t: '.', s: '>'}
    EQUAL: {t: '=', s: '+'}
    GRAVE: {t: '`', s: '~'}
    LBKT: {t: '[', s: '{'}
    RBKT: {t: ']', s: '}'}
    MINUS: {t: '-', s: '_'}
    SEMI: {t: ';', s: ':'}
    SEMICOLON: {t: ';', s: ':'}
    SINGLE_QUOTE: {t: '''', s: '"'}
    SLASH: {t: '/', s: '?'}

    # Modifiers
    LCTRL: ⌃
    RCTRL: ⌃
    LEFT_CONTROL: ⌃
    RIGHT_CONTROL: ⌃
    LSHFT: ⇧
    RSHFT: ⇧
    LEFT_SHFT: ⇧
    RIGHT_SHFT: ⇧
    LALT: ⎇
    RALT: ⎇
    LEFT_ALT: ⎇
    RIGHT_ALT: ⎇
    LGUI: ⌘
    RGUI: ⌘
    LEFT_GUI: ⌘
    RIGHT_GUI: ⌘

    # Media
    C_REWIND: ⏮
    C_FAST_FORWARD: ⏭
    C_PAUSE: ⏯
    C_MUTE: "VOL\nMUTE"
    C_VOLUME_DOWN: "VOL\nDOWN"
    C_VOLUME_UP: "VOL\nUP"
    C_BRIGHTNESS_DEC: ☀↓
    C_BRIGHTNESS_INC: ☀↑

    # keymap-drawer's defaults (v0.23.0) for everything not set above
    EXCLAMATION: '!'
    EXCL: '!'
    AT_SIGN: '@'
    AT: '@'
    HASH: '#'
    POUND: '#'
    DOLLAR: $
    DLLR: $
    PERCENT: '%'
    PRCNT: '%'
    CARET: ^
    AMPERSAND: '&'
    AMPS: '&'
    ASTERISK: '*'
    ASTRK: '*'
    STAR: '*'
    LEFT_PARENTHESIS: (
    LPAR: (
    RIGHT_PARENTHESIS: )
    RPAR: )
    PLUS: +
    UNDERSCORE: _
    UNDER: _
    FSLH: /
    QUESTION: '?'
    QMARK: '?'
    BSLH: \
    PIPE: '|'
    NON_US_BACKSLASH: \
    PIPE2: '|'
    NON_US_BSLH: '|'
    COLON: ':'
    SQT: ''''
    APOSTROPHE: ''''
    APOS: ''''
    DOUBLE_QUOTES: '"'
    DQT: '"'
    LESS_THAN: <
    LT: <
    PERIOD: .
    GREATER_THAN: '>'
    GT: '>'
    LEFT_BRACKET: '['
    LEFT_BRACE: '{'
    LBRC: '{'
    RIGHT_BRACKET: ']'
    RIGHT_BRACE: '}'
    RBRC: '}'
    TILDE: '~'
    NON_US_HASH: '#'
    NUHS: '#'
    TILDE2: '~'
