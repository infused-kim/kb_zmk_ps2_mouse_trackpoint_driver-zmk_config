manifest:
  # ZMK and all modules that publish matching versions use this revision.
  #
  # When upgrading ZMK, update the `revision` below together with the
  # `@<ref>` of build-user-config.yml in .github/workflows/build.yml.
  defaults:
    revision: main

  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: infused-kim
      url-base: https://github.com/infused-kim

  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml

    #
    # Additional zmk modules
    #

    # Module for PS/2 mouse & TP driver
    - name: kb_zmk_ps2_mouse_trackpoint_driver
      remote: infused-kim

  self:
    path: config
